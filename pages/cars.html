<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cars - Stackly Motors</title>
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/webp"
      href="../assets/images/stackly-logo.webp"
    />
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body data-page="cars">
    <!-- Header Component Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main>
      <!-- Newsletter & CTA Banner Section -->
      <section class="newsletter-cta-section" id="newsletter">
        <div class="newsletter-cta-container">
          <!-- Top Row: Newsletter Subscription -->
          <div class="newsletter-top-row">
            <div class="newsletter-info">
              <span class="newsletter-badge">NEWSLETTER</span>
              <h2 class="newsletter-title">
                Stay Updated with the<br />
                Latest Automotive News
              </h2>
              <p class="newsletter-desc">
                Get the latest offers, new arrivals and automotive tips.
              </p>
            </div>
            <div class="newsletter-form-wrapper">
              <form
                class="newsletter-form"
                id="newsletter-form"
                onsubmit="return false;"
              >
                <div class="newsletter-input-group">
                  <input
                    type="email"
                    class="newsletter-input"
                    id="newsletter-email"
                    placeholder="Enter your email address"
                    required
                    aria-label="Email address"
                  />
                  <button
                    type="submit"
                    class="btn-newsletter-subscribe"
                    aria-label="Subscribe to newsletter"
                  >
                    <span>Subscribe</span>
                    <i class="fa-solid fa-arrow-right"></i>
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Bottom Row: Ready to Drive CTA Banner -->
          <div class="newsletter-bottom-row">
            <div class="cta-drive-info">
              <h3 class="cta-drive-title">Ready to Drive Your Dream Car?</h3>
              <p class="cta-drive-desc">
                Explore our wide range of cars or book a test drive today.
              </p>
            </div>
            <div class="cta-drive-actions">
              <a href="pages/cars.html" class="btn-cta-explore">Explore Cars</a>
              <a href="pages/contact.html" class="btn-cta-testdrive"
                >Book Test Drive</a
              >
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer Component Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Master Script -->
    <script src="../assets/js/script.js"></script>
  </body>
</html>
